<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTKiaz App — Books, Poems, Quotes &amp; Sound</title>
<meta name="description" content="Home for J.T. KIAS's books, poems, African quotes and spoken word music.">
<link rel="icon" type="image/webp" href="covers/icon.webp">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="scroll-progress" id="scroll-progress"></div>

<header class="site-header">
  <div class="wrap">
    <a href="#/" class="wordmark">
      <img class="jtk-logo-mark" src="covers/icon.webp" alt="" loading="eager" onerror="this.remove()">
      JTKiaz<span class="accent">App</span>
    </a>
    <ul class="tabnav" id="tabnav">
      <li><button data-tab="home"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button></li>
      <li><button data-tab="books"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5c3-1.5 6-1.5 8 0v14c-2-1.5-5-1.5-8 0zM20 5c-3-1.5-6-1.5-8 0v14c2-1.5 5-1.5 8 0z"/></svg>Books</button></li>
      <li><button data-tab="poems"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 4c-6 0-10 4-14 12 5-2 9-2 12-5M4 20l4-4"/></svg>Poems</button></li>
      <li><button data-tab="quotes"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 8c-2 0-3 1.5-3 3.5S5 15 7 15c0 2-1 3-3 3M17 8c-2 0-3 1.5-3 3.5S15 15 17 15c0 2-1 3-3 3"/></svg>Quotes</button></li>
      <li><button data-tab="music"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Music</button></li>
      <li><button data-tab="blog"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Blog</button></li>
    </ul>
    <!-- Light/dark mode toggle — logic lives in js/app.js. See README §8.9.2. -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">🌙</button>
    <!-- Playlist ("sponsor cart") button — badge count is filled in by js/app.js. See README §16. -->
    <button class="playlist-btn" id="playlist-btn" aria-label="Open your playlist">
      🎵<span class="playlist-badge" id="playlist-count" hidden>0</span>
    </button>
    <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
  </div>
</header>

<main id="view-root"></main>

<div class="seam silver"></div>
<!--
  SITE FOOTER — the small plain-text line at the very bottom of every page.
  To change it: edit the text inside the <div class="wrap"> below directly.
  Leave the <a href="update-content.html"> link in place — that's what lets
  you (or whoever manages content) get back to the content-update tool.
  See README §16.2 "Changing the footers" for more, including the second,
  gold "Support" bar right underneath this one.
-->
<footer class="site-footer">
  <div class="wrap">
    <img class="footer-logo" src="assets/images/branding/jtk-logo.png" alt="" loading="lazy" onerror="this.remove()">Hippy Vibes International Studio · JTKiaz App · <a href="update-content.html" style="text-decoration:underline">Update content</a>
  </div>
</footer>

<!--
  FOOTER SPONSOR BAR — the gleaming gold bar with the WhatsApp button.
  Its text and link are NOT edited here — they're set automatically by
  js/app.js -> updateFooterCta() depending on which tab/item the reader
  is on. The text below is only the very first thing shown before the
  app finishes loading. See README §16.2 for exactly which lines to edit.
-->
<div class="footer-cta-wrap">
  <div class="wrap footer-cta">
    <span class="footer-cta-text" id="footer-cta-text">Enjoying the studio? <strong>Support Hippy Vibes</strong> directly.</span>
    <a class="footer-cta-btn" id="footer-cta-btn" href="#" target="_blank" rel="noopener">💛 Support on WhatsApp</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
